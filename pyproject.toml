[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enzyme-kinetics-michaelis-menten"
version = "2.0.0"
description = "EnzymeKinetics Sentinel: Michaelis-Menten, Lineweaver-Burk & Ki Inhibition Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
enzyme-kinetics-michaelis-menten = "enzyme_kinetics.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/enzyme-kinetics-michaelis-menten"
Repository = "https://github.com/abusuraihsakhri/enzyme-kinetics-michaelis-menten.git"
