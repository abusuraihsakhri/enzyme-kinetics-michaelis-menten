[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enzyme-kinetics-michaelis-menten"
version = "3.0.1"
description = "Enzyme kinetics calculations, fitting, and optional audit API"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
dev = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["cli", "simulator", "enrichment"]

[tool.setuptools.packages.find]
include = ["enzyme_kinetics*", "agents*"]

[project.scripts]
enzyme-kinetics-michaelis-menten = "enzyme_kinetics.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/enzyme-kinetics-michaelis-menten"
Repository = "https://github.com/abusuraihsakhri/enzyme-kinetics-michaelis-menten.git"
